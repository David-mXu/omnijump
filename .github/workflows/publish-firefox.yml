name: Publish to Firefox Add-ons

on:
  push:
    tags:
      - 'firefox/v*'

permissions:
  contents: read

concurrency:
  group: publish-firefox
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  publish-firefox:
    needs: test
    runs-on: ubuntu-latest
    # Configure Required reviewers on this environment (Settings →
    # Environments → firefox-addons) so AMO submissions need human approval.
    environment: firefox-addons
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:firefox

      - name: Submit to Firefox Add-ons
        # Secrets via env (never on argv): web-ext reads them natively, and
        # the tool itself is the package.json-pinned copy with lockfile
        # integrity via `npm ci` above — no floating npx downloads here.
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
        run: |
          npx web-ext sign \
            --channel=listed \
            --source-dir=dist/firefox \
            --artifacts-dir=web-ext-artifacts
