name: factory-wake

# Starts the GCP devbox when factory work arrives. The VM's own 5-minute timer
# picks up the queued issue; the VM stops itself after AUTOSTOP_MINUTES idle.
#
# Setup: repo variables GCP_WIF_PROVIDER, GCP_SA_EMAIL, GCP_PROJECT, GCP_ZONE,
# VM_NAME. Auth is GitHub OIDC -> GCP Workload Identity Federation (no key).

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: factory-wake
  cancel-in-progress: false

jobs:
  wake:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'factory:ready') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, '/factory')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Queue issue on /factory
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request == null && contains(github.event.comment.body, '/factory')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['factory:ready']
            });

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Start devbox if stopped
        env:
          VM: ${{ vars.VM_NAME }}
          ZONE: ${{ vars.GCP_ZONE }}
          PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            status=$(gcloud compute instances describe "$VM" \
              --zone "$ZONE" --project "$PROJECT" --format='value(status)')
            echo "devbox: $status"
            case "$status" in
              RUNNING)
                echo "already running; the 5-minute factory timer will pick it up"
                exit 0 ;;
              TERMINATED|STOPPED|SUSPENDED)
                gcloud compute instances start "$VM" --zone "$ZONE" --project "$PROJECT"
                exit 0 ;;
              STOPPING|SUSPENDING|PROVISIONING|STAGING|REPAIRING)
                sleep 5 ;;
              *)
                echo "unexpected status; not starting"
                exit 1 ;;
            esac
          done
          echo "timed out waiting for a stable status"
          exit 1
