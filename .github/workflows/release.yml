# Publishes to the Chrome Web Store when a version tag is pushed or triggered manually.
#
# Automated release via git tag:
#   npm version patch            # bumps package.json (manifest reads it) + creates tag vX.Y.Z
#   git push --follow-tags       # triggers this workflow
#
# Manual upload via GitHub Actions UI:
#   Actions -> Release -> "Run workflow" -> optionally choose auto-publish (submit for review)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CHROME_EXTENSION_ID  (or CWS_EXTENSION_ID)  the 32-char id from the Developer Dashboard
#   CHROME_PUBLISHER_ID  (or CWS_PUBLISHER_ID)  the publisher ID from CWS Developer Dashboard
#   CHROME_CLIENT_ID     (or CWS_CLIENT_ID)     OAuth client id (Google Cloud → APIs & Services)
#   CHROME_CLIENT_SECRET (or CWS_CLIENT_SECRET) OAuth client secret
#   CHROME_REFRESH_TOKEN (or CWS_REFRESH_TOKEN) refresh token for CWS API
# See docs/publishing.md for details.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      auto_publish:
        description: 'Auto-publish (submit for review after upload)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-cws
  cancel-in-progress: false

jobs:
  # The `chrome-store` environment should have Required reviewers configured
  # (Settings → Environments → chrome-store) so every store submission gets a
  # human approval — the tag push alone must not be able to publish.
  publish:
    runs-on: ubuntu-latest
    environment: chrome-store
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npx tsc --noEmit
      - run: npm test

      - name: Resolve and verify version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ${PKG}"; exit 1
          fi
          # VERSION is later expanded inside shell commands, so it must be a
          # plain semver tag — anything else is rejected before it can be
          # interpreted by the shell (tag names can legally contain $(), etc).
          RESOLVED="${PKG}"
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            RESOLVED="${GITHUB_REF_NAME}"
          fi
          if ! [[ "${RESOLVED}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to release non-semver version: ${RESOLVED}"; exit 1
          fi
          echo "VERSION=${RESOLVED}" >> "$GITHUB_ENV"

      - run: npm run build:all

      - name: Package zips
        run: |
          (cd dist/chrome  && zip -qr "../omnijump-chrome-${VERSION}.zip" .)
          (cd dist/firefox && zip -qr "../omnijump-firefox-${VERSION}.zip" .)

      - name: Upload and publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID || secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID || secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID || secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET || secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN || secrets.CWS_REFRESH_TOKEN }}
        run: |
          # The uploader is the devDependency-pinned copy (installed via
          # `npm ci` above, with lockfile integrity) — never a floating
          # npx download executed next to store credentials.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.auto_publish }}" = "false" ]; then
            npx chrome-webstore-upload-cli upload \
              --source "dist/omnijump-chrome-${VERSION}.zip"
          else
            npx chrome-webstore-upload-cli \
              --source "dist/omnijump-chrome-${VERSION}.zip"
          fi

      - name: Attach zips to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        # Pinned by SHA: third-party action running with contents:write.
        uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3
        with:
          files: dist/*.zip
          generate_release_notes: true
