<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniJump</title>
    <link rel="icon" type="image/png" sizes="128x128" href="../images/icon128.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../images/icon32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../images/icon16.png" />
    <link rel="shortcut icon" href="../images/icon32.png" />
    <style>
      /* Shared tokens & components live in theme.css (imported via popup.ts).
         Only popup-specific layout lives here. */
      body, body.popup { min-width: 320px; padding: var(--s4); }

      .brand {
        display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3);
      }
      .brand-mark { width: 20px; height: 20px; border-radius: 4px; display: block; flex-shrink: 0; }
      .brand-name { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; color: var(--foreground); }
      .brand-name b { color: var(--accent); font-weight: 700; }

      label { display: block; font-size: 12px; font-weight: 500; margin-top: var(--s3); margin-bottom: var(--s1); color: var(--foreground); }
      #shortcutKey { font-family: var(--font-mono); }

      button[type="submit"] { margin-top: var(--s3); width: 100%; padding: 8px 10px; font-size: 13px; }
      #status { margin-top: var(--s2); font-size: 12px; min-height: 14px; color: var(--muted-foreground); }

      #openPanel {
        margin-top: var(--s2); width: 100%; display: inline-flex; align-items: center;
        justify-content: center; gap: 6px; padding: 7px; font-size: 12px; font-weight: 500;
        background: var(--secondary); border: 1px solid var(--border); border-radius: var(--r-md); color: var(--secondary-foreground);
      }
      #openPanel svg { width: 13px; height: 13px; }
      #openPanel:hover { background: var(--accent-weak); color: var(--accent); border-color: var(--accent-border); }

      #suggestion {
        background: var(--accent-weak); border: 1px solid var(--accent-border);
        border-left: 4px solid var(--accent);
        border-radius: var(--r-md); padding: var(--s2) var(--s3);
        margin-bottom: var(--s3); font-size: 12px;
        box-shadow: var(--shadow-sm);
      }
      #suggestionText { color: var(--foreground); margin-bottom: var(--s2); line-height: 1.4; }
      #suggestionActions { display: flex; gap: var(--s2); }
      #saveSuggestion { flex: 1; }
    </style>
  </head>
  <body class="popup">
    <header class="brand">
      <img src="../images/icon32.png" width="20" height="20" alt="OmniJump" class="brand-mark" />
      <span class="brand-name">Omni<b>Jump</b></span>
    </header>
    <div id="suggestion" hidden>
      <div id="suggestionText"></div>
      <div id="suggestionActions">
        <button type="button" id="saveSuggestion" class="btn-primary btn-sm">Save it</button>
        <button type="button" id="dismissSuggestion" class="btn-secondary btn-sm">Dismiss</button>
      </div>
    </div>
    <form id="shortcutForm">
      <label for="shortcutKey">Keyword</label>
      <input id="shortcutKey" type="text" autocomplete="off" />
      <label for="shortcutUrl">Destination URL</label>
      <input id="shortcutUrl" type="text" placeholder="google.com or https://..." />
      <div id="urlAncestors" class="url-ancestors"></div>
      <button type="submit" class="btn-primary">Save shortcut</button>
      <div id="status" role="status"></div>
    </form>
    <button type="button" id="openPanel">
      Open full panel
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    </button>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
