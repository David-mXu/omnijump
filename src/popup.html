<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniJump</title>
    <style>
      /* Shared tokens & components live in theme.css (imported via popup.ts).
         Only popup-specific layout lives here. */
      body { min-width: 300px; padding: var(--s4); }

      .brand {
        display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3);
      }
      .brand-mark { color: var(--accent); display: flex; }
      .brand-name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
      .brand-name b { color: var(--accent); }

      label { display: block; font-size: 12px; margin-top: var(--s3); margin-bottom: var(--s1); color: var(--text-2); }
      #shortcutKey { font-family: var(--font-mono); }

      button[type="submit"] { margin-top: var(--s3); width: 100%; padding: 9px 10px; font-size: 13px; }
      #status { margin-top: var(--s2); font-size: 12px; min-height: 14px; color: var(--text-2); }

      #openPanel {
        margin-top: var(--s2); width: 100%; display: inline-flex; align-items: center;
        justify-content: center; gap: 6px; padding: 7px; font-size: 11px;
        background: none; border: 1px solid var(--border); border-radius: var(--r-sm); color: var(--text-3);
      }
      #openPanel svg { width: 13px; height: 13px; }
      #openPanel:hover { background: var(--surface-2); color: var(--text); }

      #suggestion {
        background: var(--accent-weak); border-left: 3px solid var(--accent);
        border-radius: var(--r-sm); padding: var(--s2) var(--s3);
        margin-bottom: var(--s3); font-size: 12px;
      }
      #suggestionText { color: var(--text); margin-bottom: var(--s2); line-height: 1.4; }
      #suggestionActions { display: flex; gap: var(--s2); }
      #saveSuggestion { flex: 1; }
    </style>
  </head>
  <body>
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor"/>
          <path d="M9 15 15 9M15 9H10M15 9v5" stroke="#fff" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-name">Omni<b>Jump</b></span>
    </header>
    <div id="suggestion" hidden>
      <div id="suggestionText"></div>
      <div id="suggestionActions">
        <button type="button" id="saveSuggestion" class="btn-primary btn-sm">Save it</button>
        <button type="button" id="dismissSuggestion" class="btn-secondary btn-sm">Dismiss</button>
      </div>
    </div>
    <form id="shortcutForm">
      <label for="shortcutKey">Keyword</label>
      <input id="shortcutKey" type="text" autocomplete="off" />
      <label for="shortcutUrl">Destination URL</label>
      <input id="shortcutUrl" type="text" placeholder="google.com or https://..." />
      <div id="urlAncestors" class="url-ancestors"></div>
      <button type="submit" class="btn-primary">Save shortcut</button>
      <div id="status" role="status"></div>
    </form>
    <button type="button" id="openPanel">
      Open full panel
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
    </button>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
