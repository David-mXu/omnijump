<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omnibar Shortcuts</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        min-width: 280px;
        padding: 16px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      label {
        display: block;
        font-size: 12px;
        margin-top: 10px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 6px 8px;
        font-size: 12px;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        outline: none;
      }
      input:focus {
        border-color: #4c6ef5;
        box-shadow: 0 0 0 2px rgba(76, 110, 245, 0.18);
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 8px 10px;
        font-size: 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      button[type="submit"] {
        background: #4c6ef5;
        color: white;
        border: none;
      }
      button[type="submit"]:hover { background: #3b5de0; }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #555;
      }
      #openPanel {
        margin-top: 8px;
        width: 100%;
        padding: 6px;
        font-size: 11px;
        background: none;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        color: #888;
        cursor: pointer;
      }
      #openPanel:hover {
        background: #f5f5f5;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Omnibar Shortcuts</h1>
    <form id="shortcutForm">
      <label for="shortcutKey">Keyword</label>
      <input id="shortcutKey" type="text" autocomplete="off" />
      <label for="shortcutUrl">Destination URL</label>
      <input id="shortcutUrl" type="text" placeholder="google.com or https://..." />
      <button type="submit">Save Shortcut</button>
      <div id="status" role="status"></div>
    </form>
    <button type="button" id="openPanel">Open full panel ↗</button>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
