<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
      body {
        width: 400px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
      }
      h2 {
        margin: 0 0 16px 0;
        font-size: 18px;
        font-weight: 600;
      }
      .section {
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 12px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-weight: 500;
        font-size: 13px;
      }
      input[type="text"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 13px;
      }
      button {
        padding: 8px 16px;
        background-color: #4285f4;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
      }
      button:hover {
        background-color: #3367d6;
      }
      button.secondary {
        background-color: #f1f3f4;
        color: #202124;
      }
      button.secondary:hover {
        background-color: #e8eaed;
      }
      button.danger {
        background-color: #d93025;
      }
      button.danger:hover {
        background-color: #c5221f;
      }
      .shortcut-list {
        max-height: 300px;
        overflow-y: auto;
      }
      .shortcut-item {
        padding: 12px;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        margin-bottom: 8px;
        background: #f8f9fa;
      }
      .shortcut-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      .shortcut-keyword {
        font-weight: 600;
        color: #1a73e8;
      }
      .shortcut-url {
        font-size: 12px;
        color: #5f6368;
        word-break: break-all;
      }
      .shortcut-actions {
        display: flex;
        gap: 4px;
      }
      .shortcut-actions button {
        padding: 4px 8px;
        font-size: 11px;
      }
      .empty-state {
        text-align: center;
        padding: 32px 16px;
        color: #5f6368;
      }
      .button-group {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .info {
        font-size: 12px;
        color: #5f6368;
        font-style: italic;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h2>🔍 Omnibar Shortcuts</h2>
    
    <div class="section">
      <h3 style="font-size: 15px; margin: 0 0 12px 0;">Add New Shortcut</h3>
      <div class="form-group">
        <label for="keyword">Keyword</label>
        <input type="text" id="keyword" placeholder="gh" />
        <div class="info">The shortcut you'll type in the omnibar</div>
      </div>
      <div class="form-group">
        <label for="url">URL</label>
        <input type="text" id="url" placeholder="https://github.com" />
        <div class="info">Use %s for search terms (e.g., https://github.com/search?q=%s)</div>
      </div>
      <div class="form-group">
        <label for="description">Description (optional)</label>
        <input type="text" id="description" placeholder="GitHub homepage" />
      </div>
      <button id="addBtn">Add Shortcut</button>
    </div>
    
    <div class="section">
      <h3 style="font-size: 15px; margin: 0 0 12px 0;">Your Shortcuts</h3>
      <div id="shortcutList" class="shortcut-list"></div>
    </div>
    
    <div class="section">
      <div class="button-group">
        <button id="exportBtn" class="secondary">Export</button>
        <button id="importBtn" class="secondary">Import</button>
      </div>
    </div>
    
    <script src="dist/popup.js"></script>
  </body>
</html>
